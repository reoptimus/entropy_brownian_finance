[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-brownian-finance"
version = "0.2.0"
description = "Entropy jumps, information relaxation and entropy-calibrated stress testing in financial markets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only needed to materialise the S&P 500 daily panel; the pipeline
# itself reads a plain CSV and has no runtime dependency on it.
sp500 = ["skfolio>=0.5"]

[tool.setuptools]
packages = ["src", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
