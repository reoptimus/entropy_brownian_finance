data:
  type: eu_stock_markets
  raw_file: data/raw/EuStockMarkets.csv
  url: https://raw.githubusercontent.com/vincentarelbundock/Rdatasets/master/csv/datasets/EuStockMarkets.csv

sample:
  start: 1991-01-02
  end: 1998-12-31
  window: 252
  min_obs: 200
  step: 1

estimation:
  covariance: ledoit_wolf
  exclude_other: false
  return_unit: log_price_diff

risk:
  forecast_horizon: 21
  realized_vol_annualization: 260

regimes:
  stress_quantile: 0.90
  calm_quantile: 0.25

outputs:
  tables: outputs/pilot_eu/tables
  figures: outputs/pilot_eu/figures
