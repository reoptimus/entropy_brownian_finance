data:
  raw_zip: data/raw/49_Industry_Portfolios_daily_CSV.zip
  processed_csv: data/processed/ff49_daily_log_returns.csv
  url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/49_Industry_Portfolios_daily_CSV.zip

sample:
  start: 1990-01-01
  end: 2026-06-30
  window: 252
  min_obs: 200
  step: 1

estimation:
  covariance: ledoit_wolf
  exclude_other: true
  return_unit: percent_to_decimal

risk:
  forecast_horizon: 21
  realized_vol_annualization: 252

regimes:
  stress_quantile: 0.90
  calm_quantile: 0.25

outputs:
  tables: outputs/tables
  figures: outputs/figures
